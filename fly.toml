# Fly.io configuration for the Wikinaut backend API.
#
# The ~14GB SQLite graph is NOT in the image; it lives on the "wikinaut_data" volume mounted at
# /data, alongside the ~1.3GB CSR link arrays. See docs/web-server-setup.md for how to load both
# onto the volume, and docs/data-source.md for how to build them. If you change the app name
# below, also update the userscript's default backend URL and its @connect directive.
app = "wikinaut-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "wikinaut_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/ok"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
