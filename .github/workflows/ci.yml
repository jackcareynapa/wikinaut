# Docs: https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions
#
# Two independent jobs, because the two halves of this repo fail for unrelated reasons:
# `userscript` guards the generated wikinaut.user.js, `backend` guards the Flask API and the
# graph-build scripts. See .github/CONTRIBUTING.md for the same checks as local commands.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  userscript:
    name: Userscript (build + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # build_userscript.py is stdlib-only, so no pip install here.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The point of the whole job: wikinaut.user.js is GENERATED from src/, and it is
      # committed because README links players straight at it for install. If the two ever
      # disagree, players get a build nobody reviewed.
      - name: wikinaut.user.js matches src/
        run: python scripts/build_userscript.py --check

      - name: Userscript parses
        run: node --check wikinaut.user.js

      # CLAUDE.md treats this as a hard rule: the cosmetic layer drives no state. Now that
      # src/fx/ is its own directory it is a cheap directory check. The second grep drops
      # comment lines, which is what keeps the comments *documenting* the rule from tripping it.
      - name: FX layer calls no engine APIs
        run: |
          if grep -rn 'Phase\.set\|setStatus\|Storage\.\(save\|clear\)\|\.click()' src/fx/ \
             | grep -v ':[[:space:]]*//'; then
            echo "::error::src/fx/ must not call Phase.set, setStatus, Storage.save/clear, or link.click()"
            exit 1
          fi

  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 3.12 matches the Dockerfile's python:3.12-slim base, so CI fails the way Fly would.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: pycodestyle --config=setup.cfg sdow/ scripts/

      # conftest.py builds the mock graph (and its CSR arrays) itself, so this needs no
      # Wikipedia dump and no network.
      - name: Tests
        run: pytest tests/ -v
